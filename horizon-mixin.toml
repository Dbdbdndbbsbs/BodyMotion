id = "hide-map"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::item_draw::Game<'_>::resolve_item_in_hand"
helper = "map_hide_bm.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
